<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate MM2 Tweak 2026</title>
  <style>
    :root {
      --purple: #9820b4;
      --purple-light: #b51ad5;
      --bg: #080808;
      --panel: #171717;
      --text: #f7f4f8;
      --muted: #c8c2ce;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 5% 8%, rgba(229, 204, 230, .92) 0, rgba(147, 130, 148, .72) 23%, rgba(44, 39, 45, .32) 43%, transparent 58%),
        #080808;
    }
    main {
      width: min(100% - 32px, 620px);
      margin: 0 auto;
      padding: 32px 0 48px;
      text-align: center;
    }
    .logo {
      width: 119px;
      height: 119px;
      border-radius: 22px;
      margin: 0 auto 5px;
      background: var(--purple);
      display: grid;
      place-items: center;
      box-shadow: 0 12px 38px rgba(0,0,0,.25);
    }
    .logo svg { width: 78px; height: 78px; }
    .tag {
      display: inline-block;
      margin: 0 0 22px;
      padding: 7px 15px;
      background: var(--purple);
      color: #08040a;
      font-size: 13px;
      font-weight: 900;
      border-radius: 5px;
    }
    h1 {
      margin: 0 0 24px;
      font-size: clamp(27px, 4vw, 38px);
      line-height: 1.12;
      font-weight: 900;
      letter-spacing: -.7px;
      text-shadow: 0 2px 0 #777;
    }
    .subtitle {
      color: var(--muted);
      font-size: 19px;
      line-height: 1.55;
      margin: 0 auto 36px;
    }
    .panel {
      text-align: left;
      background: rgba(24,24,24,.96);
      border: 1px solid #252525;
      border-radius: 16px;
      padding: 38px 37px 28px;
      box-shadow: 0 18px 45px rgba(0,0,0,.24);
    }
    h2 {
      color: var(--purple-light);
      text-align: center;
      font-size: 22px;
      margin: 0 0 25px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 17px;
      margin: 17px 0 21px;
      font-size: 16px;
      line-height: 1.4;
    }
    .number {
      flex: 0 0 33px;
      height: 33px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #09040b;
      background: var(--purple);
      font-weight: 900;
      font-size: 17px;
    }
    .notice {
      margin: 24px 0 18px;
      padding: 16px 17px;
      background: rgba(133, 91, 19, .23);
      border-left: 5px solid #ffad00;
      border-radius: 5px;
      color: #ffb52e;
      font-size: 14px;
      line-height: 1.5;
    }
    .token {
      border: 1px solid #383838;
      background: #030303;
      color: var(--purple-light);
      border-radius: 10px;
      min-height: 65px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font: 14px/1.5 Consolas, "Courier New", monospace;
      overflow-wrap: anywhere;
    }
    .copy {
      flex: 0 0 auto;
      border: 0;
      border-radius: 6px;
      background: var(--purple);
      color: white;
      font-weight: 800;
      padding: 9px 12px;
      cursor: pointer;
    }
    .copy:hover { background: #b52bd0; }
    .status {
      min-height: 20px;
      margin: 12px 0 0;
      text-align: center;
      color: #c8c2ce;
      font-size: 13px;
    }
    @media (max-width: 520px) {
      main { padding-top: 22px; }
      .logo { width: 96px; height: 96px; }
      .panel { padding: 28px 20px 22px; }
      .subtitle { font-size: 16px; }
      .step { gap: 12px; font-size: 15px; }
      .token { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-label="Logo">
      <svg viewBox="0 0 100 100" role="img" aria-hidden="true">
        <polygon points="50,4 88,25 88,70 50,93 12,71 12,26" fill="#fff"/>
        <polygon points="50,18 75,32 75,64 50,79 25,65 25,33" fill="#9820b4"/>
        <rect x="43" y="35" width="14" height="29" rx="1" fill="#ffd33d"/>
      </svg>
    </div>
    <div class="tag">PRO TWEAK</div>
    <h1>Ultimate MM2 Tweak 2026</h1>
    <p class="subtitle">Free haking software.<br>Activate your Pro-Status now.</p>

    <section class="panel">
      <h2>Activation Link Ready</h2>
      <div class="step"><span class="number">1</span><span>Open <strong>PowerShell</strong> from your Start menu.</span></div>
      <div class="step"><span class="number">2</span><span>Click the box below to <strong>copy</strong> your demo token.</span></div>
      <div class="step"><span class="number">3</span><span>Use this demo token only in a trusted app. It is not a system command.</span></div>

      <div class="token">
        <span id="token">DEMO-TOKEN-REPLACE-ME</span>
        <button class="copy" id="copyButton" type="button">Copy token</button>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    const button = document.getElementById('copyButton');
    const token = document.getElementById('token').textContent;
    const status = document.getElementById('status');
    button.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(token);
        status.textContent = 'Demo token copied.';
      } catch {
        status.textContent = 'Copy is unavailable in this browser. Select the token and copy it manually.';
      }
    });
  </script>
</body>
</html>
